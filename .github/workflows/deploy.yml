# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # .env.production (committed) supplies the public analytics endpoint.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-bundle
          path: dist

  # pokemondle.io polls this release and installs each new build (deploy/windows/update-site.ps1).
  publish-bundle:
    needs: build
    runs-on: ubuntu-latest
    # A manual run from another branch must not go live on pokemondle.io.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-bundle
          path: dist
      - run: cd dist && zip -qr ../site.zip .
      - name: Create the rolling release on first run
        run: |
          gh release view site-latest >/dev/null 2>&1 || \
            gh release create site-latest --target main --prerelease --latest=false \
              --title "Latest site build" --notes "Rolling build of main, installed automatically by pokemondle.io."
      - run: gh release upload site-latest site.zip --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
